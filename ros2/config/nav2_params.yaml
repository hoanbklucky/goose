# ==========================================================
# Goosebot Nav2 Configuration
# ==========================================================
#
# Navigation2 (Nav2) controls autonomous movement.
#
# Data flow:
#
# Sensors
#    |
#    v
# robot_localization EKF
#    |
#    v
# /odometry/filtered
#    |
#    v
# Nav2
#    |
#    v
# /cmd_vel
#    |
#    v
# motor_node
#
# ==========================================================



amcl:

  ros__parameters:

    use_sim_time: false



# ==========================================================
# Controller Server
# ==========================================================

controller_server:

  ros__parameters:


    controller_frequency: 10.0


    min_x_velocity_threshold: 0.001

    min_y_velocity_threshold: 0.001

    min_theta_velocity_threshold: 0.001



    progress_checker_plugin:

      - progress_checker



    goal_checker_plugins:

      - goal_checker



    controller_plugins:

      - FollowPath



    FollowPath:

      plugin:

        "dwb_core::DWBLocalPlanner"




# ==========================================================
# Planner Server
# ==========================================================

planner_server:

  ros__parameters:


    planner_plugins:

      - GridBased



    GridBased:

      plugin:

        "nav2_navfn_planner/NavfnPlanner"



# ==========================================================
# Behavior Server
# ==========================================================

behavior_server:

  ros__parameters:


    behavior_plugins:

      - spin

      - backup

      - drive_on_heading



# ==========================================================
# Costmap Configuration
# ==========================================================

local_costmap:


  local_costmap:

    ros__parameters:


      update_frequency: 5.0


      publish_frequency: 2.0



      global_frame:

        odom



      robot_base_frame:

        base_link



      rolling_window: true



      width: 3


      height: 3


      resolution: 0.05



global_costmap:


  global_costmap:

    ros__parameters:


      update_frequency: 1.0


      publish_frequency: 1.0



      global_frame:

        map



      robot_base_frame:

        base_link



      resolution: 0.05




# ==========================================================
# Map Server
# ==========================================================

map_server:

  ros__parameters:


    use_sim_time: false



# ==========================================================
# Lifecycle Manager
# ==========================================================

lifecycle_manager_navigation:

  ros__parameters:


    autostart: true


    node_names:


      - controller_server

      - planner_server

      - behavior_server
