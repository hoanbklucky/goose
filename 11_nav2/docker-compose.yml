services:
  nav-sim:
    build: .
    image: nav-sim:humble
    container_name: nav_sim_env
    # Required for Humble images on newer Docker/glibc combos -- without this
    # the container can fail to start certain processes. Known issue, see:
    # https://github.com/Tiryoh/docker-ros2-desktop-vnc/pull/56
    security_opt:
      - seccomp:unconfined
    shm_size: '512m'
    ports:
      - "6080:80"   # open http://localhost:6080 in any browser once it's running
    volumes:
      # IMPORTANT: confirm the actual home/user path inside the image before
      # relying on this -- run `docker compose run nav-sim whoami` once to check,
      # then adjust the right-hand side of this mount to match.
      - ./ros2_ws:/home/ubuntu/ros2_ws
    restart: unless-stopped

  # OPTIONAL, opt-in only -- NOT part of the default onboarding path.
  # Native Linux with an NVIDIA GPU only. Do not attempt this on Windows/WSL2
  # laptops with hybrid graphics (integrated + discrete GPU) -- known to be
  # unreliable; see README for why this isn't the default.
  # Run with: docker compose --profile gpu up nav-sim-gpu
  nav-sim-gpu:
    profiles: ["gpu"]
    build: .
    image: nav-sim:humble
    container_name: nav_sim_env_gpu
    security_opt:
      - seccomp:unconfined
    shm_size: '512m'
    ports:
      - "6080:80"
    volumes:
      - ./ros2_ws/src:/home/ubuntu/ros2_ws/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
