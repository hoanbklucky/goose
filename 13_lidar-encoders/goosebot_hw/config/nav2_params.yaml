# Nav2 params for the real robot on JAZZY (same distro as the sim: plugin/param naming unchanged).
# Changed vs sim: use_sim_time false; slower limits (starting points, recompute after README step 3/10);
# footprint from hardware notes + STEP; ToF source (NaN-safe: inf_is_valid false); lighter costmap rates.
# Sim comments were dropped by the YAML round-trip; keep the sim file for rationale.
# RPLIDAR C1 (/scan, 360 deg) added as a second obstacle source in both costmaps and in the collision monitor, so the
# sides and rear are now watched too. The front ToF stays: it is mounted lower and sees things under the scan plane.
# with_lidar:=false: hw_nav2.launch.py removes the `lidar` source automatically (otherwise the collision monitor would
# wait on a /scan that never arrives and never let the robot move).
bt_navigator:
  ros__parameters: {use_sim_time: false, global_frame: map, robot_base_frame: base_footprint,
    odom_topic: /odometry/filtered, bt_loop_duration: 10, default_server_timeout: 20}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.3,
      movement_time_allowance: 6.0}
    goal_checker: {plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.15,
      yaw_goal_tolerance: 6.28, stateful: true}
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [ObstacleFootprint, Oscillation, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 4.0
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 1.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.025
      footprint: '[[0.085, -0.085], [0.085, 0.085], [-0.085, 0.085], [-0.085, -0.085]]'
      footprint_padding: 0.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_topic: /projected_map,
        subscribe_to_updates: true, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: tof_front lidar
        footprint_clearing_enabled: true
        tof_front: {topic: /tof_front/scan, data_type: LaserScan, marking: true, clearing: true,
          obstacle_max_range: 0.8, obstacle_min_range: 0.0, raytrace_max_range: 1.0,
          raytrace_min_range: 0.0, min_obstacle_height: 0.01, max_obstacle_height: 2.0,
          inf_is_valid: false}
        # obstacle_min_range 0.10: drops returns from the lidar's own mount; anything that close is inside the
        # footprint anyway. inf_is_valid false: only real returns mark or clear (same rule as the ToF).
        lidar: {topic: /scan, data_type: LaserScan, marking: true, clearing: true,
          obstacle_max_range: 1.0, obstacle_min_range: 0.10, raytrace_max_range: 1.5,
          raytrace_min_range: 0.0, min_obstacle_height: 0.01, max_obstacle_height: 2.0,
          inf_is_valid: false}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 6.0,
        inflation_radius: 0.12}
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      track_unknown_space: true
      footprint: '[[0.085, -0.085], [0.085, 0.085], [-0.085, 0.085], [-0.085, -0.085]]'
      footprint_padding: 0.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_topic: /projected_map,
        subscribe_to_updates: true, map_subscribe_transient_local: true, transform_tolerance: 0.3}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: tof_front lidar
        footprint_clearing_enabled: true
        tof_front: {topic: /tof_front/scan, data_type: LaserScan, marking: true, clearing: true,
          obstacle_max_range: 1.5, obstacle_min_range: 0.0, raytrace_max_range: 2.0,
          raytrace_min_range: 0.0, min_obstacle_height: 0.01, max_obstacle_height: 2.0,
          inf_is_valid: false}
        lidar: {topic: /scan, data_type: LaserScan, marking: true, clearing: true,
          obstacle_max_range: 3.0, obstacle_min_range: 0.10, raytrace_max_range: 3.5,
          raytrace_min_range: 0.0, min_obstacle_height: 0.01, max_obstacle_height: 2.0,
          inf_is_valid: false}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 5.0,
        inflation_radius: 0.18}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased: {plugin: 'nav2_navfn_planner::NavfnPlanner', tolerance: 0.3, use_astar: false,
      allow_unknown: true}
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.77
    rotational_acc_lim: 2.0
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true,
      waypoint_pause_duration: 0}
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.2, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.3
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
      time_before_collision: 1.0, min_points: 1, enabled: true}
    # The collision monitor has no minimum-range filter for scans: ANY lidar return from the robot itself (camera
    # bracket, cables, mount posts) counts as an obstacle and blocks motion. README Part 6 step 5 checks for this.
    observation_sources: [tof_front, lidar]
    tof_front: {type: scan, topic: /tof_front/scan, source_timeout: 0.5, enabled: true}
    lidar: {type: scan, topic: /scan, source_timeout: 0.5, enabled: true}
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    dock_plugins: [dummy_dock]
    dummy_dock: {plugin: 'opennav_docking::SimpleChargingDock'}
# AMCL: only started by hw_robot.launch.py with rtab:=false and the lidar on. Localizes on the saved grid
# (NAME.yaml/.pgm) and publishes map->odom. The grid must have been built with the lidar (lidar.grid_sensor: lidar or
# both in slam_params.yaml); a stereo-only grid does not match what the lidar sees at its scan height.
# alpha1-5 are raised above the Nav2 defaults because skid-steer + open-loop odometry slips a lot. Starting values.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 8.0
    max_beams: 60
    min_particles: 300
    max_particles: 1000
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.2
    update_min_d: 0.05
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
