%YAML:1.0
#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.type: "PinHole"

Camera.fx: 746.14936
Camera.fy: 746.30625
Camera.cx: 308.19367
Camera.cy: 253.27643

# distortion parameters
Camera.k1: -0.006008
Camera.k2: -0.121173
Camera.p1: -0.000167
Camera.p2: -0.000743
Camera.k3: 0.000000

# Camera original resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 15.0

# Camera.bf: 40.0  # Set based on your baseline

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# ThDepth: 40.0
# DepthMapFactor: 1.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 500 #1000

# ORB Extractor: Scale factor between levels in the scale pyramid 
ORBextractor.scaleFactor: 1.2 #1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8 #8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 20 #20
ORBextractor.minThFAST: 7 #7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# IMU Parameters (PLACEHOLDER — for pipeline verification only, not physically calibrated yet)
#--------------------------------------------------------------------------------------------
# Transformation from camera to body-frame (IMU)
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9981347, -0.0610485, 0.0000000, -0.0223000,
          0.0607141,  0.9926668, -0.1045285,  0.0114000,
          0.0063814,  0.1043335,  0.9945219, -0.1108000,
          0.0000000,  0.0000000,  0.0000000,  1.0000000]

# IMU noise parameters (placeholder MEMS-typical values, not measured from your MPU6050)
IMU.NoiseGyro: 0.004
IMU.NoiseAcc: 0.04
IMU.GyroWalk: 0.00002
IMU.AccWalk: 0.0004
IMU.Frequency: 169
