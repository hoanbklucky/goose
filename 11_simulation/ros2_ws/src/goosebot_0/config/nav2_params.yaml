bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    # Velocity feedback for DWB comes from the EKF output (default is "odom",
    # which nothing publishes on this robot).
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 6.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
      stateful: true

    # DWB controller -- default choice for skid-steer/diff-drive robots
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 3.0
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["ObstacleFootprint", "Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 4.0
      PathAlign.scale: 1.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 1.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.025

      footprint: "[[0.10, -0.0975], [0.10, 0.0975], [-0.10, 0.0975], [-0.10, -0.0975]]"
      footprint_padding: 0.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /projected_map
        subscribe_to_updates: true
        map_subscribe_transient_local: true

      # STEP 9: front ToF as a live obstacle source for the LOCAL costmap only.
      # The ToF is a SINGLE beam straight ahead (see robot.urdf.xacro), so this
      # sees one thin line in front of the robot: anything beside/behind the
      # robot, or ahead but off the beam axis, is invisible. Cells it marks are
      # only cleared when a beam passes back through them, so expect stale
      # marks after the robot turns (unverified against Nav2 internals).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: tof
        footprint_clearing_enabled: true
        tof:
          topic: /tof_front/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # Local window is 1 m x 1 m centred on the robot, so nothing beyond
          # ~0.5 m from the robot can be marked; raytrace slightly further.
          # If you enlarge the window, raise obstacle_max_range with it.
          obstacle_max_range: 0.6
          obstacle_min_range: 0.0
          raytrace_max_range: 1.0
          raytrace_min_range: 0.0
          # Sensor sits 3 cm above the floor; skip floor hits (z ~ 0).
          min_obstacle_height: 0.01
          max_obstacle_height: 2.0
          # Gazebo lidar reports inf for "nothing in range". Without this,
          # those beams never raytrace-clear old obstacles.
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.12

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05

      # Rolling window (SLAM use): the costmap follows the robot instead of
      # being resized to the SLAM map, so goals outside the currently-mapped
      # area are still in bounds. track_unknown_space makes cells outside the
      # map "unknown" (not "free"); planner_server's allow_unknown: true lets
      # Navfn plan through them. Goals farther than width/2 or height/2 from
      # the robot are still out of bounds -- enlarge these if needed.
      rolling_window: true
      width: 20
      height: 20
      track_unknown_space: true

      footprint: "[[0.10, -0.0975], [0.10, 0.0975], [-0.10, 0.0975], [-0.10, -0.0975]]"
      footprint_padding: 0.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # Static layer source: map_server's /projected_map (slam:=false) or
      # RTAB-Map's /rtabmap/map (slam:=true); the launch file rewrites map_topic.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /projected_map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
        transform_tolerance: 0.3

      # Front ToF as a live obstacle source for the GLOBAL costmap, so walls
      # missing from the SLAM map (e.g. untextured walls stereo can't see)
      # reach the planner and force a different path. Same single forward
      # beam as the local costmap's layer, so it sees one thin line ahead of
      # the robot only. Marks are cleared only where a beam passes back
      # through them, so stale marks can build up after the robot turns away.
      # Ranges are shorter than the sensor's 8 m to limit stale marks and
      # far-wall noise.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: tof
        footprint_clearing_enabled: true
        tof:
          topic: /tof_front/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          # Sensor sits 3 cm above the floor; skip floor hits (z ~ 0).
          min_obstacle_height: 0.01
          max_obstacle_height: 2.0
          # Gazebo lidar reports inf for "nothing in range"; without this
          # those beams never raytrace-clear old obstacles.
          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.18

      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.5]
    min_velocity: [-0.30, 0.0, -1.5]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.3
    # No real zones or sensors configured yet -- this is a pass-through
    # config so the node configures cleanly instead of blocking bringup.
    # NOTE: polygons/observation_sources can't be empty lists -- rcl_yaml_param_parser
    # can't infer a type for a zero-element array, and collision_monitor
    # doesn't catch that, so it throws an uncaught exception and aborts.
    # Give each a real entry but keep them disabled instead.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # Was 2.0. At the old 0.10 m/s that looked ahead 0.2 m; at the new
      # 0.30 m/s max it would look ahead 0.6 m and slow the robot well before
      # corners and walls. 1.0 s = 0.3 m at full speed (stopping distance at
      # decel 1.5 m/s^2 is only ~3 cm, so this leaves margin for latency).
      # Tuning judgement, adjust to taste.
      time_before_collision: 1.0
      # STEP 10: was 6. The single-beam ToF produces at most 1-2 points per
      # scan, so a threshold of 6 could never be reached. Keep this at 1 (or
      # at most 2): anything higher can never trigger with this sensor.
      min_points: 1
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      # STEP 10: was "/scan" (nothing publishes that); the ToF topic is
      # /tof_front/scan (see ros_gz_bridge.yaml).
      topic: "/tof_front/scan"
      source_timeout: 0.5
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    # No physical dock on this robot -- dock_plugins must still be declared
    # (same empty-list issue as collision_monitor above), but nothing here
    # gets used unless a DockRobot action is actually called.
    dock_plugins: ["dummy_dock"]
    dummy_dock:
      plugin: "opennav_docking::SimpleChargingDock"
