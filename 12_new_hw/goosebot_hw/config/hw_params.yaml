# ALL VALUES MARKED "CAL" ARE PLACEHOLDERS UNTIL YOU RUN THE README CALIBRATION STEPS.
motor_driver:
  ros__parameters:
    dry_run: false
    wheel_separation: 0.137       # CAL step 1 (measure centre-to-centre of left/right wheel contact patches)
    v_max: 1.15
    v_floor: 0.28
    w_floor: 1.1
    min_duty: 0.14                # CAL step 3 (stiction; the old repo used 0.07 -- on carpet/with load expect higher)
    min_duty_spin: 0.18
    max_duty: 0.85                # keep <=0.85 on a full 3S pack (see motor_driver_node.py docstring)
    max_duty_rate: 3.0
    linear_scale: 1.0             # CAL step 4
    angular_scale: 0.78           # CAL step 4 (skid-steer: usually <1.0 -- the robot turns LESS than commanded)
    invert_left: false
    invert_right: false
    fr: [0, 1] #default forward
    rr: [3, 2] #reversed backwards
    rl: [5, 4] #reversed backwards
    fl: [6, 7] #funny

cmd_vel_mux:
  ros__parameters:
    timeout: 0.5
    lane_angular_sign: -1.0       # verify on bench

imu_node:
  ros__parameters:
    bus: 6                        # /dev/i2c-6 (I2C6-M0, pins 27/28), MPU6050 confirmed at 0x68
    address: 0x68
    gyro_range_dps: 500
    dlpf_cfg: 3
    gyro_z_sign: 1.0              # CAL step 2: rotate CCW, /imu/data angular_velocity.z must be POSITIVE
    rebias_when_stopped: false

# SINGLE-SENSOR BENCH CONFIG. One VL53L1X on /dev/i2c-4 (I2C4-M3, pins 23/24), confirmed at 0x29.
# xshut_lines -1 = no XSHUT wired, node uses the sensor as-is at its address.
# When you add more sensors: wire XSHUT for ALL of them, restore the 4-entry lists, and use
# addresses 0x30-0x33 (names: [front, left, right, rear]).
tof_node:
  ros__parameters:
    bus: 4
    names: [front]
    addresses: [0x29]
    xshut_chips: [/dev/gpiochip4]   # FILL from gpioinfo (unused while xshut_lines is -1)
    xshut_lines: [-1]               # FILL when XSHUT is wired; -1 = none
    distance_mode: 1
    timing_budget_ms: 50
    offsets_m: [0.0]                # CAL step 6
    scales: [1.0]                   # CAL step 6
    none_as: "nan"

stereo_camera:
  ros__parameters:
    left_device: /dev/cam_left
    right_device: /dev/cam_right
    width: 640
    height: 480
    fps: 15
    fourcc: MJPG
    exposure_abs: -1                                  # CAL step 7: fix exposure on both to the same value
    left_info: /home/phredg/goosebot_calib/left_camera.yaml   # from camera_calibration (README step 7)
    right_info: /home/phredg/goosebot_calib/right_camera.yaml

cmd_vel_to_odom:
  ros__parameters:
    publish_tf: false             # EKF owns odom->base_footprint. NEVER set true.
    linear_scale: 1.0             # CAL step 4 (leave 1.0 if motor_driver.linear_scale already fixed it)
    xy_var: 0.1
    vx_var: 0.1
